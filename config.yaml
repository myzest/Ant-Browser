database:
    type: sqlite
    sqlite:
        path: data/app.db
app:
    name: Ant Browser
    window:
        width: 1750
        height: 1000
        min_width: 1200
        min_height: 700
    max_profile_limit: 100
    used_cd_keys: []
runtime:
    max_memory_mb: 0
    gc_percent: 100
logging:
    level: info
    file_enabled: false
    file_path: data/logs/app.log
    format: text
    buffer_size: 4
    async_queue_size: 1000
    flush_interval_ms: 1000
    rotation:
        enabled: false
        max_size_mb: 100
        max_age: 7
        max_backups: 5
        time_interval: daily
    interceptor:
        enabled: true
        log_parameters: true
        log_results: true
        sensitive_fields:
            - password
            - token
            - secret
geoip:
    enabled: false
    provider: maxmind
    edition_id: GeoLite2-City
    cache_dir: data/geoip
    auto_update: true
    max_age_days: 30
    timeout_ms: 15000
browser:
    user_data_root: data
    default_fingerprint_args:
        - --fingerprint-brand=Chrome
        - --fingerprint-platform=windows
        - --lang=zh-CN
        - --fingerprint-locale=zh-CN
        - --fingerprint-accept-language=zh-CN,zh;q=0.9
        - --timezone=Asia/Shanghai
        - --fingerprint-timezone=Asia/Shanghai
        - --window-size=1920,1080
        - --fingerprint-screen-avail=1920,1040
        - --fingerprint-device-pixel-ratio=1
        - --fingerprint-color-depth=24
        - --fingerprint-hardware-concurrency=8
        - --fingerprint-device-memory=8
        - --fingerprint-canvas-noise=true
        - --fingerprint-audio-noise=true
        - --fingerprint-webgl-vendor=Intel
        - --fingerprint-webgl-renderer=Intel(R) UHD Graphics 630
        - --fingerprint-fonts=Segoe UI,Calibri,Cambria Math,Consolas,Arial,Tahoma,Times New Roman,Verdana,Microsoft YaHei,SimSun
        - --webrtc-ip-handling-policy=disable_non_proxied_udp
        - --fingerprint-webrtc-ip=auto
        - --fingerprint-do-not-track=false
        - --fingerprint-touch-points=0
        - --fingerprint-media-devices=1,1,1
    default_launch_args:
        - --disable-sync
        - --no-first-run
    default_start_urls: []
    restore_last_session: false
    start_ready_timeout_ms: 3000
    start_stable_window_ms: 1200
proxy_check:
    bridge_start_timeout_ms: 15000
    speed_target_id: ""
    ip_health_target_id: ""
    targets: []
launch_server:
    port: 19876
    auth:
        enabled: false
        api_key: ""
        header: X-Ant-Api-Key
automation:
    enabled: false
    install_policy: on_demand
    runtime_version: node-22.15.1-playwright-core-1.59.0
    keep_runtime_on_disable: true
    node_source: auto
    node_version: 22.15.1
    playwright_core_version: 1.59.0

database:
  type: sqlite
  sqlite:
    path: data/app.db
app:
  name: Ant Browser
  window:
    width: 1750
    height: 1000
    min_width: 1200
    min_height: 700
  max_profile_limit: 20
  used_cd_keys: []
runtime:
  max_memory_mb: 1024
  gc_percent: 100
geoip:
  enabled: false
  provider: maxmind
  edition_id: GeoLite2-City
  account_id: "${MAXMIND_ACCOUNT_ID}"
  license_key: "${MAXMIND_LICENSE_KEY}"
  database_path: ""
  cache_dir: data/geoip
  auto_update: true
  max_age_days: 30
  timeout_ms: 15000
logging:
  level: info
  file_enabled: false
  file_path: data/logs/app.log
  format: text
  buffer_size: 4
  async_queue_size: 1000
  flush_interval_ms: 1000
  rotation:
    enabled: false
    max_size_mb: 100
    max_age: 7
    max_backups: 5
    time_interval: daily
  interceptor:
    enabled: true
    log_parameters: true
    log_results: true
    sensitive_fields:
      - password
      - token
      - secret
browser:
  user_data_root: data
  default_fingerprint_args:
    - --fingerprint-brand=Chrome
    - --fingerprint-platform=linux
    - --lang=zh-CN
    - --fingerprint-accept-language=zh-CN,zh;q=0.9
    - --fingerprint-locale=zh-CN
    - --timezone=Asia/Shanghai
    - --fingerprint-timezone=Asia/Shanghai
    - --window-size=1920,1080
    - --fingerprint-screen-avail=1920,1000
    - --fingerprint-device-pixel-ratio=1
    - --fingerprint-color-depth=24
    - --fingerprint-hardware-concurrency=8
    - --fingerprint-device-memory=8
    - --fingerprint-canvas-noise=true
    - --fingerprint-audio-noise=true
    - --fingerprint-webgl-vendor=Intel
    - --fingerprint-webgl-renderer=Mesa Intel(R) UHD Graphics 620
    - --fingerprint-fonts=Arimo,Cousine,Tinos,Noto Sans,Noto Sans CJK SC,Noto Color Emoji
    - --webrtc-ip-handling-policy=disable_non_proxied_udp
    - --fingerprint-webrtc-ip=auto
    - --fingerprint-do-not-track=false
    - --fingerprint-touch-points=0
    - --fingerprint-media-devices=0,1,1
  default_launch_args:
    - --disable-sync
    - --no-first-run
  default_bookmarks: []
  cores: []
  proxies: []
  profiles: []
launch_server:
  port: 19876
automation:
  enabled: false
  install_policy: on_demand
  runtime_version: node-22.15.1-playwright-core-1.59.0
  headless_default: false
  keep_runtime_on_disable: true
  node_source: auto
  system_node_path: ""
  node_version: 22.15.1
  playwright_core_version: 1.59.0
